<!DOCTYPE html> 
<html lang="pt-en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Web</title>
    <link rel="icon" type="image/png" href="img/logopokedex.png">
    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  
  <header class="header-home">
    <div class="header-wrapper">
      
      <div class="header-top">
        <div class="logo-area">
          <img src="img/logopokedex.png" alt="Pokéball" class="logo">
          <h1><span class="poke-white">Poké</span><span class="dex-red">Dex</span></h1>
        </div>
        
        <div class="nav-buttons">
          <button class="btn-nav"><i class="fas fa-home"></i> Início</button>
          <button class="btn-nav"><i class="fas fa-heart"></i> Meus Favoritos</button>
        </div>
      </div>
    
      <div class="search-area">
        <input type="text" id="search-input" class="search-input" placeholder="Buscar por nome ou ID......">
        <button id="btn-search" class="btn-search-action">Buscar</button>
      </div>

    </div>
  </header>
 
  <main class="container">
   
    <div id="pokemon-container"></div>
  </main>

 
  <div id="pokemon-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button id="close-modal" class="btn-close"><i class="fas fa-times"></i></button>
      <div id="modal-details-container"></div>
    </div>
  </div>
    
  <script src="script.js"></script>
</body>
</html>
